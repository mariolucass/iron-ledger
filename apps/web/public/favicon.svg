<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <radialGradient id="bgGrad" cx="50%" cy="40%" r="60%" fx="50%" fy="30%">
      <stop offset="0%" stop-color="#2D3139" />
      <stop offset="100%" stop-color="#0F1115" />
    </radialGradient>

    <!-- Metallic Edge/Accent Gradient -->
    <linearGradient id="metalGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#E2E8F0" />
      <stop offset="50%" stop-color="#94A3B8" />
      <stop offset="100%" stop-color="#475569" />
    </linearGradient>

    <!-- Glowing Iron Accent -->
    <linearGradient id="ironOrange" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FF5E3A" />
      <stop offset="60%" stop-color="#FF9500" />
      <stop offset="100%" stop-color="#FFCC00" />
    </linearGradient>
    
    <!-- Soft Drop Shadow for Depth -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background Base (Squircle / Apple Style Rounded Rect) -->
  <rect x="24" y="24" width="464" height="464" rx="108" fill="url(#bgGrad)" stroke="#1E293B" stroke-width="6" />

  <!-- Outer Ring (Subtle metallic track) -->
  <rect x="44" y="44" width="424" height="424" rx="92" fill="none" stroke="url(#metalGrad)" stroke-width="2" stroke-opacity="0.2" />

  <!-- Stylized Geometric "I" & "L" / Iron Shield Motif -->
  <g transform="translate(136, 120)" filter="url(#glow)">
    <!-- Right Shield Half (L / Ledger representation - Glowing Orange Accent) -->
    <path d="M 120,0 L 210,50 L 210,180 C 210,240 160,280 120,300 C 120,300 120,0 120,0 Z" 
          fill="url(#ironOrange)" 
          opacity="0.95" />
          
    <!-- Left Shield Half (I / Iron representation - Premium Metallic Gray) -->
    <path d="M 120,0 L 30,50 L 30,180 C 30,240 80,280 120,300 C 120,300 120,0 120,0 Z" 
          fill="url(#metalGrad)" />
          
    <!-- Dynamic Negative Space Cut/Dividing Line -->
    <path d="M 120,0 L 120,300" stroke="#0F1115" stroke-width="12" stroke-linecap="round" />
    
    <!-- Inner geometric ledger lines cut (Sleek tech look) -->
    <path d="M 70,110 L 100,125" stroke="#0F1115" stroke-width="8" stroke-linecap="round" opacity="0.4" />
    <path d="M 70,160 L 100,175" stroke="#0F1115" stroke-width="8" stroke-linecap="round" opacity="0.4" />
    
    <path d="M 170,110 L 140,125" stroke="#0F1115" stroke-width="8" stroke-linecap="round" opacity="0.4" />
    <path d="M 170,160 L 140,175" stroke="#0F1115" stroke-width="8" stroke-linecap="round" opacity="0.4" />
  </g>
</svg>
