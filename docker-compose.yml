name: iron-ledger

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: iron_ledger
      POSTGRES_USER: iron_ledger
      POSTGRES_PASSWORD: iron_ledger
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U iron_ledger -d iron_ledger"]
      interval: 5s
      timeout: 5s
      retries: 10

  rabbitmq:
    image: rabbitmq:3.13-management-alpine
    environment:
      RABBITMQ_DEFAULT_USER: iron_ledger
      RABBITMQ_DEFAULT_PASS: iron_ledger
    ports:
      - "5672:5672"
      - "15672:15672"
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7.4-alpine
    command: redis-server --appendonly yes
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build:
      context: .
      dockerfile: infra/docker/api.Dockerfile
      target: development
    environment:
      NODE_ENV: development
      PORT: 3000
      DATABASE_URL: postgresql://iron_ledger:iron_ledger@postgres:5432/iron_ledger?schema=public
      RABBITMQ_URL: amqp://iron_ledger:iron_ledger@rabbitmq:5672
      JWT_SECRET: local-development-secret-change-before-production
      JWT_EXPIRES_IN: 1h
      SEED_ADMIN_EMAIL: admin@ironledger.local
      SEED_ADMIN_PASSWORD: ChangeMe123!
    ports:
      - "3000:3000"
    volumes:
      - ./apps/api/src:/workspace/apps/api/src
      - ./apps/api/prisma:/workspace/apps/api/prisma
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    command: sh -c "pnpm --dir apps/api prisma:deploy && pnpm --dir apps/api prisma:seed && pnpm --dir apps/api dev"

  analytics:
    profiles: ["analytics"]
    build:
      context: .
      dockerfile: infra/docker/analytics.Dockerfile
    environment:
      ANALYTICS_DATABASE_PATH: /app/data/processed/analytics.db
    ports:
      - "8000:8000"
    volumes:
      - ./services/analytics/data:/app/data
      - ./services/analytics/reports:/app/reports

volumes:
  postgres_data:
  rabbitmq_data:
  redis_data:
